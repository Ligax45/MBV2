<div class="library-page">
  <app-recipe-search-bar
    [value]="searchQuery()"
    (valueChange)="onSearchChange($event)"
  />

  @if (loading()) {
    <div class="library-page__state" role="status">
      <p-progressSpinner ariaLabel="Chargement des recettes" />
    </div>
  } @else if (loadFailed()) {
    <div class="library-page__state" role="status">
      <p class="library-page__empty">Les recettes n'ont pas pu être chargées.</p>
    </div>
  } @else if (filteredRecipes().length === 0) {
    <p-message
      severity="info"
      text="Aucune recette ne correspond à votre recherche."
      styleClass="library-page__message"
    />
  } @else {
    <div class="library-page__grid">
      @for (recipe of filteredRecipes(); track recipe.id) {
        <app-recipe-card [recipe]="recipe" />
      }
    </div>
  }
</div>
