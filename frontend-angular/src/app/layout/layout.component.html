<div class="app-shell">
  <app-topbar
    [attr.inert]="mobileMenuOpen() ? '' : null"
    [mobileMenuOpen]="mobileMenuOpen()"
    (mobileMenuToggle)="toggleMobileMenu()"
  />
  <app-mobile-menu
    [open]="mobileMenuOpen()"
    (closed)="closeMobileMenu()"
  />

  <div class="app-body" [attr.inert]="mobileMenuOpen() ? '' : null">
    <app-sidebar />
    <main class="app-main">
      <router-outlet />
    </main>
  </div>

  <app-alert-container />
</div>
