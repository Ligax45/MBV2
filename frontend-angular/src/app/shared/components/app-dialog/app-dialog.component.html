<p-dialog
  [header]="title()"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="closable()"
  [dismissableMask]="dismissableMask()"
  [style]="dialogStyle()"
  [styleClass]="resolvedDialogStyleClass()"
>
  <ng-content />

  <ng-template #footer>
    <ng-content select="[appDialogFooter]" />
  </ng-template>
</p-dialog>
