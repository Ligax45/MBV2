<div class="recipe-star-rating" [attr.aria-label]="ariaLabel()">
  <span class="recipe-star-rating__stars" [class.recipe-star-rating__stars--interactive]="interactive()">
    @for (star of starIndexes; track star) {
      @if (interactive()) {
        <button
          type="button"
          class="recipe-star-rating__star-btn"
          [disabled]="disabled()"
          [attr.aria-label]="'Noter ' + star + ' sur 5'"
          (click)="onStarClick($event, star)"
          (keydown)="onStarKeydown($event, star)"
        >
          <i [class]="starIcon(star)" aria-hidden="true"></i>
        </button>
      } @else {
        <i [class]="starIcon(star)" aria-hidden="true"></i>
      }
    }
  </span>
  @if (rating() != null) {
    <span class="recipe-star-rating__value">{{ displayRating() | number: '1.1-1' }}</span>
  }
</div>
